# ============================================================================
# OpenELIS Analyzer Bridge — Nidan stack
# ============================================================================
# This lab's XN-350 connects to host:12000 without ENQ framing, so compose maps:
#   host 12000 → container 12011 (ASTM E1381-95)
#   host 12010 → container 12001 (ASTM E1381-02 / ENQ)
#
# Analyzer IP observed: 192.168.10.113 → host 192.168.10.112:12000
# ============================================================================

bridge:
  # v3.0.4 defaults useFhir=true; ASTMResultParser cannot parse Sysmex R-records.
  # Keep false so raw ASTM posts to OE /analyzer/astm for SysmexXN-L plugin.
  routing:
    useFhir: false

  security:
    enabled: true
    username: bridge
    password: ${BRIDGE_AUTH_PASSWORD:changeme}

  # Bracket keys required: YamlPropertiesFactoryBean flattens dotted IPs into nested
  # paths (192 → 168 → …), so plain "192.168.10.113" never binds into the map.
  # Use a non-numeric id. OE treats numeric X-Analyzer-Id as a GenericASTM
  # analyzer lookup and skips the SysmexXN-L plugin. Plugin matches via H-record.
  analyzers:
    "[192.168.10.113]":
      id: SYSMEX-XN350-001
      name: "Sysmex XN-350"
      expectedProtocol: ASTM
    "[167.82.48.223]":
      id: SYSMEX-XN350-001
      name: "Sysmex XN-350"
      expectedProtocol: ASTM

  file:
    enabled: false
    watchDirectories:
      - /mnt/analyzer-import
    archiveDirectory: /mnt/analyzer-archive
    errorDirectory: /mnt/analyzer-error
    pollIntervalMs: 5000
    fileStabilityTimeoutMs: 3000
    maxRetryAttempts: 3
    retryDelayMs: 1000
    filePatterns:
      - "*.csv"
      - "*.hl7"
      - "*.txt"

org:
  itech:
    ahb:
      forward-http-server:
        uri: http://openelis:8080/OpenELIS-Global/analyzer
        username: ${OPENELIS_USERNAME:admin}
        password: ${OPENELIS_PASSWORD:adminADMIN!}
        insecure-tls: false
        connect-timeout-seconds: 30
        read-timeout-seconds: 30
        max-attempts: 3
        backoff-ms: 1000

      listen-astm-server:
        port: 12001
        establishment-timeout-seconds: 15
        receive-timeout-seconds: 30

      listen-astm-e1381-95-server:
        port: 12011

      forward-astm-server:
        host-name: localhost
        port: 5000

      mllp:
        enabled: false
        port: 2575

      serial:
        enabled: false

server:
  port: 8443

logging:
  level:
    root: INFO
    org.itech: DEBUG
    org.itech.ahb.lib.astm: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  health:
    mllp:
      enabled: true
    serial:
      enabled: true
    filewatcher:
      enabled: true
    httpforward:
      enabled: true
